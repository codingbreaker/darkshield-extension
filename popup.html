<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>DarkShield</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:320px;background:#0a0a14;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;font-size:13px}

    .header{padding:14px 16px 12px;border-bottom:1px solid #1f2937;display:flex;align-items:center;justify-content:space-between}
    .header-left{display:flex;align-items:center;gap:10px}
    .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ef4444,#991b1b);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .title{font-size:14px;font-weight:800;color:#fca5a5}
    .sub{font-size:10px;color:#4b5563;margin-top:1px}

    /* Toggle */
    .toggle{position:relative;width:38px;height:22px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .toggle-track{position:absolute;inset:0;border-radius:99px;background:#1f2937;cursor:pointer;transition:background .2s}
    .toggle input:checked+.toggle-track{background:#ef4444}
    .toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;pointer-events:none}
    .toggle input:checked~.toggle-thumb{transform:translateX(16px)}

    /* Score card */
    .score-card{margin:12px 16px;background:#111827;border-radius:12px;padding:14px;border:1px solid #1f2937}
    .score-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .score-num{font-size:36px;font-weight:900;line-height:1}
    .score-label{font-size:11px;color:#6b7280;margin-top:2px}
    .score-status{font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px}
    .status-clean{background:#14532d22;color:#4ade80;border:1px solid #14532d44}
    .status-warn{background:#78350f22;color:#fbbf24;border:1px solid #78350f44}
    .status-danger{background:#7f1d1d22;color:#f87171;border:1px solid #7f1d1d44}

    /* Progress bar */
    .bar{height:4px;background:#1f2937;border-radius:99px;overflow:hidden;margin-bottom:10px}
    .bar-fill{height:100%;border-radius:99px;transition:width .5s}

    .site-url{font-size:10px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* Pattern list */
    .section-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#4b5563;font-weight:600;padding:0 16px;margin-bottom:6px}

    .pattern-list{padding:0 16px;display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;margin-bottom:12px}
    .pattern-list::-webkit-scrollbar{width:3px}
    .pattern-list::-webkit-scrollbar-thumb{background:#1f2937;border-radius:99px}

    .pattern-item{background:#111827;border-radius:9px;padding:10px 12px;border:1px solid #1f2937;cursor:pointer;transition:border-color .15s,background .15s}
    .pattern-item:hover{border-color:#374151;background:#1a1a2e}
    .pattern-item.has-findings{border-color:var(--p-color)22}
    .pattern-header{display:flex;align-items:center;justify-content:space-between}
    .pattern-left{display:flex;align-items:center;gap:7px}
    .pattern-emoji{font-size:14px;line-height:1}
    .pattern-name{font-size:12px;font-weight:600;color:#e2e8f0}
    .pattern-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--p-color)22;color:var(--p-color);border:1px solid var(--p-color)44}
    .pattern-count.zero{background:#1f293722;color:#374151;border-color:#1f2937}
    .pattern-desc{font-size:10px;color:#4b5563;margin-top:3px}
    .pattern-items{margin-top:6px;padding-top:6px;border-top:1px solid #1f2937;display:none;flex-direction:column;gap:3px}
    .pattern-items.open{display:flex}
    .pattern-item-text{font-size:10px;color:#6b7280;padding:3px 6px;background:#0a0a14;border-radius:4px;word-break:break-word}

    /* Actions */
    .actions{padding:0 16px 14px;display:flex;gap:7px}
    .btn{flex:1;padding:9px;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-rescan{background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff}
    .btn-clear{background:#111827;color:#6b7280;border:1px solid #1f2937}

    /* Safe state */
    .safe-state{text-align:center;padding:20px 16px;color:#4b5563;font-size:12px}
    .safe-icon{font-size:32px;margin-bottom:8px}

    /* Footer */
    .footer{padding:8px 16px;border-top:1px solid #111827;text-align:center}
    .footer a{font-size:10px;color:#374151;text-decoration:none}
    .footer a:hover{color:#ef4444}
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">🛡️</div>
    <div>
      <div class="title">DarkShield</div>
      <div class="sub">by @codingbreaker</div>
    </div>
  </div>
  <label class="toggle" title="Enable/Disable highlights">
    <input type="checkbox" id="toggle-enabled" checked>
    <div class="toggle-track"></div>
    <div class="toggle-thumb"></div>
  </label>
</div>

<div id="main-content">
  <!-- Filled by JS -->
  <div style="padding:24px;text-align:center;color:#4b5563;font-size:12px">
    🔍 Scanning page…
  </div>
</div>

<div class="footer">
  <a href="https://github.com/codingbreaker" target="_blank">@codingbreaker · github.com/codingbreaker</a>
</div>

<script src="popup.js"></script>
</body>
</html>
